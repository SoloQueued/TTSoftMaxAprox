# Tiny Tapeout project information
project:
  title:        "nonLUT_softmax"      # Project title
  author:       "DerekTDLe"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "LUT-less 4-input softmax for Q8.8 inputs: shift-only PWL exp and a shared serial divider"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nonlut_softmax"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "max4_signed16.v"
    - "norm_sub.v"
    - "exp_lane.v"
    - "norm_div.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "input byte bit 0 (Q8.8 high byte, then low byte)"
  ui[1]: "input byte bit 1 (Q8.8 high byte, then low byte)"
  ui[2]: "input byte bit 2 (Q8.8 high byte, then low byte)"
  ui[3]: "input byte bit 3 (Q8.8 high byte, then low byte)"
  ui[4]: "input byte bit 4 (Q8.8 high byte, then low byte)"
  ui[5]: "input byte bit 5 (Q8.8 high byte, then low byte)"
  ui[6]: "input byte bit 6 (Q8.8 high byte, then low byte)"
  ui[7]: "start (when idle) / input byte bit 7"

  # Outputs
  uo[0]: "softmax_out[0] / serial data bit[0]"
  uo[1]: "softmax_out[1] / serial data bit[1]"
  uo[2]: "softmax_out[2] / serial data bit[2]"
  uo[3]: "softmax_out[3] / serial data bit[3]"
  uo[4]: "softmax_out[4] / serial data bit[4]"
  uo[5]: "softmax_out[5] / serial data bit[5]"
  uo[6]: "softmax_out[6] / serial data bit[6]"
  uo[7]: "softmax_out[7] / serial data bit[7]"

  # Bidirectional pins
  uio[0]: "done flag"
  uio[1]: "output valid"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
